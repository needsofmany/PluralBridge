<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Forgot Password</title>
	<script>
		(function () {
			var storedLabel = "missing";
			var prefersLight = false;
			var prefersDark = false;
			var theme = "dark";
			try {
				var stored = window.localStorage.getItem("pluralbridge.theme");
				if (stored === "light" || stored === "dark") {
					storedLabel = stored;
					theme = stored;
				} else {
					storedLabel = stored ? "other" : "missing";
					prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
					prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
					if (prefersLight && !prefersDark) {
						theme = "light";
					}
				}
			} catch (error) {
				storedLabel = "unavailable";
				theme = "dark";
			}
			var root = document.documentElement;
			root.setAttribute("data-theme", theme);
			root.style.colorScheme = theme;
			root.style.backgroundColor = theme === "light" ? "#ffffff" : "#101418";
			console.info("[auth-theme] phase=initial saved=" + storedLabel + " prefersLight=" + prefersLight + " prefersDark=" + prefersDark + " applied=" + theme);
		})();
	</script>
	<style>
		html, body { background: #101418; }
		html[data-theme="light"], html[data-theme="light"] body { background: #ffffff; }
	</style>
	<link rel="stylesheet" href="/auth/auth.css">
</head>
<body data-auth-page="forgot-password">
	<main class="auth-card">
		<h1 class="auth-title">Forgot password</h1>
		<p class="auth-subtitle">Enter your username or email to request password reset instructions.</p>

		<div class="auth-providers">
			<button class="auth-provider" type="button" disabled aria-disabled="true" aria-label="Google sign-in is not available">
				<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
					<path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"></path>
					<path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"></path>
					<path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.1 26.8 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"></path>
					<path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.6 7.1l6.3 5.3C37.4 38.4 44 34 44 24c0-1.3-.1-2.7-.4-3.5z"></path>
				</svg>
				<span>Google</span>
			</button>
			<button class="auth-provider" type="button" disabled aria-disabled="true" aria-label="Apple sign-in is not available">
				<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
					<path fill="currentColor" d="M16.4 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.3.8s-1.7-.8-2.8-.7c-1.5.1-2.8.9-3.5 2.2-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.6 2.2 2.7 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7 1.9-1.1 2.6-2.1c.8-1.2 1.1-2.3 1.2-2.4-.1 0-2.2-.9-2.3-3.4zM14.7 6.6c.6-.7 1-1.7.9-2.6-.9 0-1.9.6-2.5 1.3-.6.6-1.1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.3z"></path>
				</svg>
				<span>Apple</span>
			</button>
			<button class="auth-provider" type="button" disabled aria-disabled="true" aria-label="GitHub sign-in is not available">
				<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
					<path fill="currentColor" d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.9 9.6.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.2-3.4-1.2-.4-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.4 9.4 0 0 1 5 0c2-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5 4-1.3 6.9-5.1 6.9-9.6C22 6.6 17.5 2 12 2z"></path>
				</svg>
				<span>GitHub</span>
			</button>
		</div>
		<button class="auth-sso" type="button" disabled aria-disabled="true" aria-label="SSO sign-in is not available">
			<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
				<path fill="currentColor" d="M8 10V8a4 4 0 0 1 8 0v2h1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h1zm2 0h4V8a2 2 0 0 0-4 0v2z"></path>
			</svg>
			<span>Continue with SSO</span>
		</button>
		<p class="auth-divider">OR</p>

		<form method="post" action="/forgot-password">
			<label class="auth-label" for="usernameOrEmail">Username or email</label>
			<input
				class="auth-input"
				id="usernameOrEmail"
				name="usernameOrEmail"
				autocomplete="username"
				required>

			<button class="auth-submit" type="submit">Send password reset</button>
		</form>

		<p class="auth-recovery"><a class="auth-link" href="/login">Back to sign in</a></p>

		<p id="authStatus" class="auth-status" hidden></p>
	</main>

	<script src="/auth/auth-pages.js"></script>
</body>
</html>
