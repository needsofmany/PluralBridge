<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Forgot Password</title>
	<link rel="stylesheet" href="/auth/auth.css">
</head>
<body data-auth-page="forgot-password">
	<main class="auth-card">
		<h1 class="auth-title">Forgot password</h1>
		<p class="auth-subtitle">Enter your username or email to request password reset instructions.</p>

		<form method="post" action="/forgot-password">
			<label class="auth-label" for="usernameOrEmail">Username or email</label>
			<input
				class="auth-input"
				id="usernameOrEmail"
				name="usernameOrEmail"
				autocomplete="username"
				required>

			<button class="auth-submit" type="submit">Send password reset</button>
		</form>

		<div class="auth-links">
			<a class="auth-link" href="/login">Back to sign in</a>
		</div>

		<p id="authStatus" class="auth-status" hidden></p>
	</main>

	<script src="/auth/auth-pages.js"></script>
</body>
</html>
