<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PluralBridge</title>

    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./css/shell.css">
    <link rel="stylesheet"
          href="./css/members-mobile.css"
          media="(max-width: 720px)">
</head>
<body>
    <div class="app-shell">

        <nav class="application-navigation"
             aria-label="Application navigation">

            <section class="application-nav-section"
                     aria-labelledby="nav-main-heading">

                <h2 id="nav-main-heading"
                    class="application-nav-heading">
                    MAIN
                </h2>

                <button type="button"
                        class="application-nav-item"
                        data-shell-main
                        data-contract="members">
                    Members
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-contract="me">
                    Session
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="fronting">
                    Fronting
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="groups">
                    Groups
                </button>

            </section>


            <section class="application-nav-section"
                     aria-labelledby="nav-data-heading">

                <h2 id="nav-data-heading"
                    class="application-nav-heading">
                    DATA
                </h2>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="import">
                    Import
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="manage-fields">
                    Manage Fields
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="history">
                    History
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="saved-views">
                    Saved Views
                </button>

            </section>


            <section class="application-nav-section"
                     aria-labelledby="nav-account-heading">

                <h2 id="nav-account-heading"
                    class="application-nav-heading">
                    ACCOUNT
                </h2>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="profile">
                    Profile
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="security">
                    Security
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="systems">
                    System(s)
                </button>

            </section>


            <section class="application-nav-section"
                     aria-labelledby="nav-administration-heading">

                <h2 id="nav-administration-heading"
                    class="application-nav-heading">
                    ADMINISTRATION
                </h2>

                <button type="button"
                        class="application-nav-item"
                        data-shell-placeholder="audit">
                    Audit
                </button>

            </section>


            <section class="application-nav-section"
                     aria-labelledby="nav-developer-heading">

                <h2 id="nav-developer-heading"
                    class="application-nav-heading">
                    DEVELOPER
                </h2>

                <button type="button"
                        class="application-nav-item"
                        data-contract="sourceSystems">
                    Source systems
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-contract="privacyBuckets">
                    Privacy buckets
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-contract="sourceRecords">
                    Source records
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-contract="sourceIdMappings">
                    Source ID mappings
                </button>

                <button type="button"
                        class="application-nav-item"
                        data-contract="importMetadata">
                    Import metadata
                </button>

            </section>


            <button type="button"
                    class="application-nav-item application-nav-signout"
                    data-session-action="logout">
                Sign out
            </button>

        </nav>

        <div class="application-navigation-backdrop"
             data-shell-menu-backdrop
             aria-hidden="true">
        </div>

        <main class="application-main">

            <header class="mobile-application-header">

                <button type="button"
                        class="mobile-navigation-toggle"
                        data-shell-menu-toggle
                        aria-expanded="false"
                        aria-label="Open application navigation">

                    <span aria-hidden="true">⚙</span>
                </button>

                <span class="mobile-application-title">
                    PluralBridge
                </span>

            </header>

            <div class="application-content">

                <div id="appOutput"
                     class="output-box"
                     aria-live="polite">
                    { }
                </div>

            </div>

        </main>

    </div>

    <script src="./app.js"></script>
</body>
</html>
